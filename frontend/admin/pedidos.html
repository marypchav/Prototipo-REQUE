<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos | Capanni</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="encabezado"></header>

  <main>
    <div class="contenedor">
      <!-- GP015 Visualizar comprobantes por administrador -->
      <div class="titulo-admin">
        <div>
          <h1>Pedidos</h1>
          <p id="resumen" aria-live="polite"></p>
        </div>
      </div>

      <div class="barra-busqueda">
        <div class="campo">
          <span class="etiqueta" id="tituloFiltroEstado">Estado</span>
          <div class="fichas" id="filtroEstado" role="group" aria-labelledby="tituloFiltroEstado"></div>
        </div>
      </div>

      <p class="cargando" id="cargando">Cargando los pedidos…</p>
      <div id="estadoPedidos"></div>
      <ul class="lista-pedidos" id="listaPedidos" aria-label="Pedidos"></ul>
    </div>
  </main>

  <footer id="pie"></footer>

  <script src="/js/comun.js"></script>
  <script src="/js/pedido-detalle.js"></script>
  <script src="/js/admin-pedidos.js"></script>
</body>
</html>
