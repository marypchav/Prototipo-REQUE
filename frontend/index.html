<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confecciones Capanni</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #222; }
    .estado { padding: 12px 16px; border-radius: 8px; background: #eee; }
    .ok { background: #e3f4e6; color: #1d5e2a; }
    .error { background: #fbe4e4; color: #8a1c1c; }
    code { background: #f3f3f3; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <!-- Página temporal: se reemplaza cuando empiece el frontend -->
  <h1>Confecciones Capanni</h1>
  <p>Página temporal para comprobar que el servidor responde.</p>
  <p id="estado" class="estado">Revisando la conexión con la API...</p>
  <p>La API está en <code>/api</code>. Ejemplo: <a href="/api/catalogos">/api/catalogos</a></p>

  <script>
    const estado = document.getElementById('estado');
    fetch('/api/catalogos')
      .then((respuesta) => respuesta.json())
      .then((json) => {
        if (!json.ok) throw new Error(json.mensaje);
        estado.className = 'estado ok';
        estado.textContent = `Servidor y base de datos conectados: ${json.datos.categorias.length} categorías y ${json.datos.tallas.length} tallas cargadas.`;
      })
      .catch((error) => {
        estado.className = 'estado error';
        estado.textContent = `No se pudo leer la API: ${error.message}`;
      });
  </script>
</body>
</html>
