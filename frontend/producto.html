<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Producto | Confecciones Capanni</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Young+Serif&display=swap" rel="stylesheet">

<body>
  <header id="encabezado"></header>

  <main>

      </nav>
      <p class="cargando" id="cargando">Cargando el producto…</p>

  <footer id="pie"></footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/comun.js"></script>
