<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Confecciones Capanni</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="encabezado"></header>

  <main class="ingreso">
    <!-- GP002 Iniciar sesión del cliente -->
    <form class="tarjeta-form" id="formIngreso" novalidate>
      <h1>Iniciar sesión</h1>
      <p class="subtitulo">Para comprar, ver su carrito y sus pedidos.</p>

      <p class="mensaje mensaje-error" id="errorIngreso" role="alert" hidden></p>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" autocomplete="username" required>
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <div class="clave-fila">
          <input type="password" id="contrasena" autocomplete="current-password" required>
          <button type="button" class="boton boton-texto" data-ver-clave="contrasena" aria-pressed="false">Mostrar</button>
        </div>
      </div>

      <button type="submit" class="boton boton-principal boton-ancho" id="botonIngresar">Iniciar sesión</button>
      <p class="pie-form">¿No tiene cuenta? <a href="/cuenta/registrarse.html" id="enlaceRegistro">Registrarse</a></p>
    </form>
  </main>

  <footer id="pie"></footer>

  <script src="/js/comun.js"></script>
  <script src="/js/cuenta-ingresar.js"></script>
</body>
</html>
